[FontSettings]
font_family = Source Sans
font_weight = 450
menu_size = 10
whatsapp_size = 10

[WindowSettings]
# Her açılışta sağ alta otomatik yerleşsin mi? (True / False)
auto_align_right_bottom = True
# Mini sohbet kutusunun genişliği ve yüksekliği (Piksel olarak)
width = 800
height = 750

